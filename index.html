<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealZone - Luxury Multi-Category Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fcfbfa; color: #1a1a1a; padding: 20px; }
        header { text-align: center; padding: 40px 20px; background-color: #111; color: #fff; border-radius: 12px; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; color: #dfb76c; }
        header p { margin-top: 10px; color: #ccc; font-size: 1.1rem; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .category-card { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.3s; text-align: center; padding-bottom: 20px; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .card-img { width: 100%; height: 200px; background-size: cover; background-position: center; }
        .card-title { font-size: 1.4rem; margin: 20px 0 10px; font-weight: 600; }
        .shop-btn { display: inline-block; background-color: #111; color: #fff; padding: 10px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .shop-btn:hover { background-color: #dfb76c; color: #111; }
    </style>
</head>
<body>

<header>
    <h1>DEALZONE</h1>
    <p>Everyday, elevated. Discover international viral products.</p>
</header>

<div class="grid-container">
    <!-- Category 1 -->
    <div class="category-card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="card-title">Makeup & Skincare</div>
        <a href="#" class="shop-btn">Shop Section</a>
    </div>

    <!-- Category 2 -->
    <div class="category-card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="card-title">Gadgets & Tech</div>
        <a href="#" class="shop-btn">Shop Section</a>
    </div>

    <!-- Category 3 -->
    <div class="category-card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="card-title">Kitchen & Home</div>
        <a href="#" class="shop-btn">Shop Section</a>
    </div>

    <!-- Category 4 -->
    <div class="category-card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="card-title">Fashion & Apparel</div>
        <a href="#" class="shop-btn">Shop Section</a>
    </div>
</div>

</body>
</html>
